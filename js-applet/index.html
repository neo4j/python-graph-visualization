<!doctype html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>neo4j-viz</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; }
    </style>
    <!--
      Data injection point.
      In dev: __NEO4J_VIZ_DATA__ is undefined, so the script falls back to sample data.
      In production: Python injects a <script> here setting window.__NEO4J_VIZ_DATA__.
    -->
  </head>
  <body>
    <div id="neo4j-viz-container" style="width: 100%; height: 100vh;"></div>

    <script type="module">
      import widget from "/src/index.tsx";

      // Detect light/dark theme from page background
      const bg = window.getComputedStyle(document.body).getPropertyValue('background-color');
      const rgb = bg.match(/\d+/g);
      if (rgb) {
        const brightness = Number(rgb[0]) * 0.2126 + Number(rgb[1]) * 0.7152 + Number(rgb[2]) * 0.0722;
        document.documentElement.className = brightness < 128 ? "dark" : "light";
      }

      // Read injected data (from Python) or fall back to sample data (for dev harness).
      const data = window.__NEO4J_VIZ_DATA__ ?? {
        nodes: [
          { id: "n0", caption: "Person", size: 30, color: "#006fd6", pinned: false, properties: { labels: ["Person"], name: "Alice", age: 30 } },
          { id: "n1", caption: "Person", size: 30, color: "#006fd6", pinned: false, properties: { labels: ["Person"], name: "Bob", age: 25 } },
          { id: "n2", caption: "Movie",  size: 40, color: "#c7362c", pinned: false, properties: { labels: ["Movie"],  title: "The Matrix", year: 1999 } },
          { id: "n3", caption: "Person", size: 30, color: "#006fd6", pinned: false, properties: { labels: ["Person"], name: "Charlie", age: 35 } },
          { id: "n4", caption: "Movie",  size: 40, color: "#c7362c", pinned: false, properties: { labels: ["Movie"],  title: "Inception", year: 2010 } },
          { id: "n5", caption: "Genre",  size: 25, color: "#57c7e3", pinned: false, properties: { labels: ["Genre"],  name: "Sci-Fi" } },
        ],
        relationships: [
          { id: "r0", from: "n0", to: "n2", caption: "WATCHED",  properties: { type: "WATCHED", rating: 5 } },
          { id: "r1", from: "n1", to: "n2", caption: "WATCHED",  properties: { type: "WATCHED", rating: 4 } },
          { id: "r2", from: "n3", to: "n4", caption: "DIRECTED", properties: { type: "DIRECTED" } },
          { id: "r3", from: "n0", to: "n1", caption: "KNOWS",    properties: { type: "KNOWS", since: 2015 } },
          { id: "r4", from: "n2", to: "n5", caption: "IN_GENRE", properties: { type: "IN_GENRE" } },
          { id: "r5", from: "n4", to: "n5", caption: "IN_GENRE", properties: { type: "IN_GENRE" } },
          { id: "r6", from: "n3", to: "n0", caption: "KNOWS",    properties: { type: "KNOWS", since: 2020 } },
        ],
        width: "100%",
        height: "100vh",
      };

      // Model shim — same interface as anywidget's model.
      // off() is needed because @anywidget/react unsubscribes on unmount.
      const model = {
        get(key) { return data[key]; },
        on() {},
        off() {},
        set() {},
        save_changes() {},
      };

      const el = document.getElementById("neo4j-viz-container");
      el.style.width = data.width ?? "100%";
      el.style.height = data.height ?? "100vh";
      widget.render({ model, el });
    </script>
  </body>
</html>
