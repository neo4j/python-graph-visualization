name: Render docs

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: ["main"]
  pull_request:
    paths:
      - "python-wrapper/**" # python code
      - "docs/**" # documentation
      - "examples/**" # notebooks rendered into the tutorials
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  ref-docs:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: python-wrapper

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - name: Install uv and set the Python version
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Build the JS applet
        uses: ./.github/actions/build-js

      - run: uv sync --group dev --group docs --extra pandas --extra neo4j --extra gds --extra snowflake

      # pandoc runs from the pinned `pandoc/core` image (see
      # scripts/sphinx_container_pandoc.py), so no local install is needed.
      - name: Render ref docs
        run: uv run bash ../scripts/render_api_docs.sh

  antora-docs:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: docs/antora

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Patch eMudhra CA compromise (CVE-2026-111943)
        shell: bash
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install --only-upgrade -y ca-certificates
          sudo update-ca-certificates --fresh

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: docs/antora/package-lock.json

      - name: Build Antora docs (fail on warnings)
        run: |
          npm ci
          npm run verify
          # Antora can exit 0 without generating a site (observed with Antora
          # 3.1.x on newer Node); guard against that silent no-op.
          test -f build/site/index.html || { echo '::error::Antora did not generate a site'; exit 1; }
