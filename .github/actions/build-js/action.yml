name: Build JS applet
description: Install Node deps and build the widget JS/CSS assets into the python-wrapper resources.

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: "lts/*"
        cache: yarn
        cache-dependency-path: js-applet/yarn.lock

    # The built assets are not committed; the package needs them on disk to
    # build the wheel/sdist and to import the widget in tests.
    - name: Build JS applet
      shell: bash
      run: ./scripts/build_js_applet.sh
