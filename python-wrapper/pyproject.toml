[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo4j-viz"
version = "1.9.0"
description = "A simple graph visualization tool"
readme = "README.md"
authors = [{ name = "Neo4j", email = "team-gds@neo4j.org" }]
license = "GPL-3.0-only"
license-files = [ "LICENSE" ]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database :: Front-Ends",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development",
    "Typing :: Typed",
]
keywords = ["graph", "visualization", "neo4j"]
dependencies = [
    "ipython >=7, <10",
    "pydantic >=2 , <3",
    "pydantic-extra-types >=2, <3",
    "enum-tools==0.13.0",
    "anywidget >=0.9, <1",
    "traitlets >=5, <6",
]
requires-python = ">=3.10"


[project.optional-dependencies]
pandas = ["pandas>=2, <3", "pandas-stubs>=2, <3"]
gds = ["graphdatascience>=1.22, <3"]
neo4j = ["neo4j"]
snowflake = ["snowflake-snowpark-python<2,>=1"]
# The Streamlit integration (neo4j_viz.streamlit) uses the Components v2 API,
# available from streamlit 1.58.
streamlit = ["streamlit<2,>=1.58"]


[dependency-groups]
dev = [
    "ruff==0.16.4",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "selenium==4.47.0",
    "ipykernel==7.3.0",
    "palettable==3.3.3",
    "pytest-mock==3.15.1",
    "nbconvert==7.17.1",
    "streamlit==1.62.0",
    "matplotlib>=3.9.4",
    "jupyterlab>=4.5.7",
    "anywidget[dev]",
    "python-dotenv"
]
docs = [
    # Sphinx is capped at 8.1.x: 8.2+ requires Python >=3.11 and Sphinx 9 requires >=3.12
    # (the docs group must satisfy requires-python = ">=3.10"), and Sphinx 9 also breaks
    # `enum_tools.autoenum` (removed `logger` from `sphinx.ext.autodoc`).
    "sphinx==8.1.3",
    "enum-tools[sphinx]",
    "nbsphinx==0.9.8",
    "nbsphinx-link==1.4.1",
]
notebook = [
    "ipykernel>=6.29.5",
    "pykernel>=0.1.6",
    "neo4j>=5.26.0",
    "ipywidgets>=8.0.0",
    "palettable>=3.3.3",
    "matplotlib>=3.9.4",
    "snowflake-snowpark-python==1.54.0",
    "requests",
    "marimo",
    "python-dotenv"
]

[project.urls]
Homepage = "https://neo4j.com/"
Repository = "https://github.com/neo4j/python-graph-visualization"
Issues = "https://github.com/neo4j/python-graph-visualization/issues"
Documentation = "https://neo4j.com/docs/python-graph-visualization/"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"] # list of folders that contain the packages (["."] by default)
include = [
    "neo4j_viz*",
] # package names should match these glob patterns (["*"] by default)
namespaces = false # only scan directories with __init__.py files (true by default)

[tool.setuptools.package-data]
neo4j_viz = [
    "resources/nvl_entrypoint/widget.js",
    "resources/nvl_entrypoint/style.css",
    "resources/nvl_entrypoint/index.html",
    "resources/streamlit_v2/graph.js",
    "resources/streamlit_v2/style.css",
    "py.typed"
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
markers =  [
    "requires_neo4j_and_gds: mark a test as a requiring a Neo4j instance with GDS running",
    "requires_snowflake: mark a test as a requiring a Snowflake connection"
]
filterwarnings = [
    "error",
    "ignore:Jupyter is migrating its paths to use standard platformdirs:DeprecationWarning",
    # snowflake vendors an older `requests` whose dependency check rejects the chardet
    # version (pulled in transitively via `encutils`). Harmless; ignore it.
    # Matched by message only: naming the category here would make pytest import
    # `snowflake.connector` to resolve it, and that import is exactly what fails.
    "ignore:.*doesn't match a supported version"
]

[tool.ruff]
line-length = 120
include = ["*.py", "*.ipynb"]

exclude = [
    # default

    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",

    # custom
    "venv*",
    ".venv*",
    ".tox",
    "build",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9", # default pycodestyle rules
    "F",  # flake8
    "I",  # isort
]

[tool.mypy]
strict = true
exclude = [
    '(^build|^\.?venv)',
    'build',
    ]
plugins = ['pydantic.mypy']
untyped_calls_exclude=["nbconvert"]
